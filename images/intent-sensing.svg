<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Wearable sensing: connecting human movement to a robot</title><desc id="desc">Conceptual side view of a walking person, highlighted wearable sensing locations, and a robot assistance loop. This is not a photograph of the experimental apparatus.</desc>
