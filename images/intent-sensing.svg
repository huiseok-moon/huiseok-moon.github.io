<text x="485" y="278" font-size="21" font-weight="bold">Observe movement</text><text x="485" y="304" font-size="17">Wearable signals describe how the body moves.</text><text x="485" y="345" font-size="21" font-weight="bold">Connect to assistance</text><text x="485" y="371" font-size="17">Recognized context can inform robot control.</text>
<text x="485" y="162" font-size="18" fill="#597285">Sense → recognize → support</text>
