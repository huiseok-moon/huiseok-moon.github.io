<g font-family="Arial,sans-serif" fill="#233e52"><text x="36" y="44" font-size="15" letter-spacing="2">THE HUMAN COMES FIRST</text><text x="36" y="82" font-size="28" font-weight="bold">What is the person doing?</text>
<circle cx="240" cy="142" r="23" fill="#36566d"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M238 181 L224 254 L174 300 L155 366 L183 366 M224 254 L275 303 L300 361 L330 361 M237 188 L195 220 L157 213 M237 188 L270 220 L305 214" stroke="#36566d" stroke-width="14"/>
